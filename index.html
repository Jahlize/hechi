<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dulcinea Designer</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --rosa-pastel: #FFF0F5;
            --rosa-principal: #FFB6C1;
            --lila-principal: #E6E6FA;
            /* Degradado lila-morado solicitado */
            --lila-morado-gradiente: linear-gradient(45deg, #9370DB, #8A2BE2);
            --azul-pastel: #E0F7FA;
            --texto: #4A4A4A;
            --negro: #000000;
        }

        body {
            background: linear-gradient(135deg, var(--rosa-pastel), var(--lila-principal), var(--azul-pastel));
            background-attachment: fixed;
            color: var(--texto);
            margin: 0;
            padding: 0;
        }

        /* Título con degradado Lila a Morado */
        .titulo-marca {
            font-size: 26px;
            font-weight: bold;
            background: var(--lila-morado-gradiente);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header { background: rgba(255, 255, 255, 0.9); padding: 15px; position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid var(--rosa-principal); }
        .header-container { max-width: 1000px; margin: auto; display: flex; justify-content: space-between; align-items: center; }

        .main-container { max-width: 1000px; margin: 25px auto; padding: 0 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }

        /* Foto de Perfil */
        .foto-perfil { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #D8BFD8; object-fit: cover; }
        .avatar-small { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }

        .post-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }

        /* Pie de página */
        footer { text-align: center; padding: 20px; font-size: 12px; color: var(--negro); font-weight: 500; }

        @media (max-width: 768px) { .main-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="titulo-marca">Dulcinea Designer</div>
            <img src="https://xatimg.com/image/qdh7T2GNGQAd.png" class="foto-perfil" alt="Perfil">
        </div>
    </header>

    <div class="main-container">
        <main>
            <article class="post-card">
                <div class="post-header">
                    <img src="https://xatimg.com/image/qdh7T2GNGQAd.png" class="avatar-small" alt="Perfil">
                    <div>
                        <strong>Dulcinea Designer</strong><br>
                        <small>Publicado recientemente 🦋</small>
                    </div>
                </div>
                <p>Bienvenidas a mi espacio creativo. Inspiración, flores y mariposas en cada diseño. ✨</p>
            </article>
        </main>

        <aside>
            <div class="post-card">
                <h4>Sobre mí</h4>
                <p>Diseñadora enfocada en la estética floral y delicada.</p>
            </div>
        </aside>
    </div>

    <footer>
        Hecho x Jahlize
    </footer>

</body>
</html>
